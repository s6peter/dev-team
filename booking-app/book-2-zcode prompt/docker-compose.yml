services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: booking_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supabase/schema-local.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./supabase/seed-local.sql:/docker-entrypoint-initdb.d/02-seed.sql
