.terraform-base:
  image: hashicorp/terraform:1.8
  extends: .rules-merge-request-or-main
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
  before_script:
    - terraform version
    - cd "${TF_ROOT:-terraform/envs/dev}"

terraform:fmt:
  extends: .terraform-base
  stage: validate
  script:
    - terraform fmt -check -recursive

terraform:validate:
  extends: .terraform-base
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate

terraform:plan:
  extends: .terraform-base
  stage: validate
  script:
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ${TF_ROOT:-terraform/envs/dev}/tfplan

terraform:apply:
  extends: .terraform-base
  stage: deploy
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - terraform init
    - terraform apply -auto-approve tfplan

