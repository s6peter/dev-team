stages:
  - validate
  - test
  - quality
  - build
  - security
  - publish
  - deploy
  - ops

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  tags:
    - eks
    - kubernetes

.rules-merge-request-or-main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
