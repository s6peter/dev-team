apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/platform-engineering/gitops-config.git
    targetRevision: main
    path: gitops/dev/sample-api
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

