trigger:
  - main

pool:
  name: Default   # Or your agent pool name

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install -g snyk
    snyk auth $(SNYK_TOKEN)
    snyk test --all-projects || true
    snyk monitor --all-projects || true
    snyk iac test || true
    snyk container test my-image:latest || true
  displayName: 'Run Snyk Scan'
  continueOnError: true


